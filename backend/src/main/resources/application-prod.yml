spring:
  datasource:
    # M-31 修复：DB 连接参数改为环境变量注入（Docker 内 DB_HOST=mysql），不再硬编码 localhost
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useServerPrepStmts=true&cachePrepStmts=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    password: ${REDIS_PASSWORD:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.pzhu.mall: WARN
