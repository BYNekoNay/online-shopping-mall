server:
  port: 8080

spring:
  application:
    name: mall
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # H-06 修复：SQL 日志（StdOutImpl）移至 application-dev.yml，避免生产环境全量打印 SQL
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # M-30 修复：移除 base 配置中的硬编码 fallback（已知密钥风险）；未设 JWT_SECRET 时启动即失败，
  # 开发环境使用 dev profile（application-dev.yml 提供开发默认值），生产必须显式注入
  secret: ${JWT_SECRET:}
  expire-seconds: 604800

mall:
  security:
    # H-1 修复：可信反向代理 IP 列表（逗号分隔，支持 CIDR，如 127.0.0.1,10.0.0.0/8）。
    # 仅当请求直连来源 remoteAddr 落在该列表内，才读取 X-Forwarded-For/X-Real-IP 取真实客户端 IP；
    # 否则一律使用 remoteAddr，防止攻击者伪造代理头绕过登录限流或伪造受害者 IP 制造锁定 DoS。
    # 默认空=不信任任何代理（安全默认）；nginx 反代部署时注入代理 IP，如 TRUSTED_PROXIES=127.0.0.1
    trusted-proxies: ${TRUSTED_PROXIES:}
  upload:
    # M-33 修复：目录改为环境变量注入 + 相对路径默认值（跨平台）；容器内设置 MALL_UPLOAD_DIR=/data/mall/uploads
    dir: ${MALL_UPLOAD_DIR:./uploads}
    base-url: ${MALL_UPLOAD_BASE_URL:http://localhost:8080/uploads}
  order:
    timeout-minutes: 30
  stock:
    lock-wait-seconds: 3
    lock-lease-seconds: 10

cors:
  # M-32 修复：允许源改为环境变量可覆盖；生产环境由 prod 配置/环境变量注入（默认空=同源部署不放行跨域）
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.pzhu.mall: INFO
    com.pzhu.mall.modules.order: DEBUG
