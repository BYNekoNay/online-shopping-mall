name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 用 install 而非 ci：本地沙箱限制导致 lock 未含新 devDependencies（eslint/prettier），
      # runner 上 install 会现场解析并更新 lock；依赖版本由 package.json 范围锁定
      - run: npm install --no-audit --no-fund
      # 质量门禁（docs/25 §2.3）：静态检查 → 单测 → 构建
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # 质量门禁（docs/25 §2.3）：verify 阶段自动执行
      # checkstyle:check（格式/命名）+ spotbugs:check（缺陷检测）+ jacoco:report（覆盖率）+ test（单测）
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-reports
          path: |
            backend/target/site/jacoco/
            backend/target/checkstyle-result.xml
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container build and publish
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/bynekonay/online-shopping-mall-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config -q
