services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: mall
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/sql/V1__init_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/main/resources/sql/R__seed_mock_behavior.sql:/docker-entrypoint-initdb.d/02-behavior.sql
      - ./backend/src/main/resources/sql/R__seed_recommend_data.sql:/docker-entrypoint-initdb.d/03-recommend.sql
      - ./scripts/init-data.sql:/docker-entrypoint-initdb.d/04-admin.sql
    networks:
      - mall-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mall-redis
    restart: always
    # H-07 修复：启用 Redis 密码，端口仅绑定到回环地址
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    environment:
      # M-41 修复：供健康检查的 redis-cli 鉴权使用
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mall-network
    # M-41 修复：健康检查，供 backend 依赖条件使用
    # 注意：$$ 为 compose 转义，字面量 $REDIS_PASSWORD 由容器 shell 展开
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MALL_ORDER_TIMEOUT_MINUTES: 30
      # M-33 配套：容器内上传目录（Dockerfile 已创建 /data/mall/uploads 并授权）
      MALL_UPLOAD_DIR: /data/mall/uploads
    depends_on:
      mysql:
        condition: service_healthy
      # M-41 修复：等待 Redis 就绪后再启动后端
      redis:
        condition: service_healthy
    networks:
      - mall-network

  nginx:
    image: nginx:alpine
    container_name: mall-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - mall-network

volumes:
  mysql_data:
  redis_data:

networks:
  mall-network:
    driver: bridge
